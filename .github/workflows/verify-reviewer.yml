name: Verify anonymous judge download
on: push
permissions: {}
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify the public release without credentials
        run: |
          set -eu
          base=https://github.com/bakkey/inayati-review/releases/download/v0.5.0-synthetic
          curl --disable --silent --show-error --fail --location --retry 3 "$base/Inayati-0.5.0-synthetic.apk" --output Inayati-0.5.0-synthetic.apk
          curl --disable --silent --show-error --fail --location --retry 3 "$base/SHA256SUMS.txt" --output SHA256SUMS.txt
          printf '%s  %s\n' 13ac706b0df9c8598b08704c92909d94594d451543c1095dbd52698aa674eaf8 Inayati-0.5.0-synthetic.apk | sha256sum --check
          sha256sum --check SHA256SUMS.txt
          curl --disable --silent --show-error --fail --location "$base/Inayati-Quick-Start.md" --output Inayati-Quick-Start.md
          curl --disable --silent --show-error --fail --location "$base/Inayati-Walkthrough.mp4" --output Inayati-Walkthrough.mp4
          printf '%s  %s\n' 7dd33cb8296cbe7cbc701974c79a154cf7aa76e0fe7765d9437d4c69ba54fde0 Inayati-Quick-Start.md | sha256sum --check
          printf '%s  %s\n' f4cfce9f4b4dfc454afc50aae7ee77344d4b42ff769254541faef0f048a468b6 Inayati-Walkthrough.mp4 | sha256sum --check